; Pot Pulse firmware — PlatformIO project.
;
; Toolchain pinning (issue #6 AC 1): the platform version below is the exact
; version used to produce the verified build/test logs in the implementing PR.
; Bumping any pin requires re-running `pio test -e native` and `pio run -e esp32c3`
; and refreshing firmware/README.md "Verified builds".
;
; Targets:
;   esp32c3  — device build for ESP32-C3-MINI-1 (native USB, per hardware/kicad).
;   native   — host unit tests for the portable core (firmware/src/pp/**).

[platformio]
name = pot-pulse-firmware
default_envs = esp32c3
test_dir = test

[env:esp32c3]
platform = espressif32@6.10.0
framework = arduino
board = esp32-c3-devkitm-1
; Arduino core 2.0.17 defaults to -std=gnu++11; replace it (unflag first,
; otherwise both flags reach the compiler and the last one wins unreliably).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DPP_DEVICE_BUILD=1
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_src_filter = +<*>

[env:native]
platform = native@1.2.1
build_flags =
    -std=gnu++17
    -DPP_NATIVE_TEST=1
build_src_filter = +<*> -<main.cpp>
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@7.4.2
test_speed = 115200
